anp_frota:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DW_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('DW_USER', 'dados') }}"
      password: "{{ env_var('DW_PASSWORD', 'dados') }}"
      dbname: "{{ env_var('DW_DBNAME', 'dw') }}"
      schema: analytics
      threads: 4
